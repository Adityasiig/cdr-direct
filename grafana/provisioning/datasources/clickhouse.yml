apiVersion: 1

deleteDatasources:
  - name: CDR ClickHouse
    orgId: 1

datasources:
  - name: CDR ClickHouse
    uid: cdr-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: grafana
      defaultDatabase: cdr
      defaultTable: cdr_hourly_media_ip
      queryTimeout: 120
      dialTimeout: 10
      enableRowLimit: true
      validateSql: true
    secureJsonData:
      password: $CLICKHOUSE_GRAFANA_PASSWORD
