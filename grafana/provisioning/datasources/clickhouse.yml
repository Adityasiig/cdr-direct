apiVersion: 1

deleteDatasources:
  - name: CDR ClickHouse
    orgId: 1

datasources:
  - name: CDR ClickHouse
    uid: cdr-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: grafana
      defaultDatabase: cdr
      defaultTable: cdr_hourly_media_ip
      queryTimeout: 120
      dialTimeout: 10
      # Dashboard table queries already have explicit SQL LIMIT clauses.
      # Enabling this makes the plugin modify ClickHouse's `limit` setting,
      # which a safely configured readonly=1 user must reject.
      enableRowLimit: false
      validateSql: true
    secureJsonData:
      password: $CLICKHOUSE_GRAFANA_PASSWORD
