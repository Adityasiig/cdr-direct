apiVersion: 1

providers:
  - name: CDR Analytics
    orgId: 1
    folder: CDR Analytics
    folderUid: cdr-analytics
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      # This path is part of the immutable image, not the persistent
      # /var/lib/grafana volume, so every deployment receives dashboard updates.
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
