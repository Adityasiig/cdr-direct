services:
  clickhouse:
    build:
      context: .
      dockerfile: Dockerfile.clickhouse
    init: true
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: cdr
      CLICKHOUSE_USER: cdr_admin
      CLICKHOUSE_PASSWORD: "${SERVICE_PASSWORD_CLICKHOUSEADMIN:?Coolify generates this ClickHouse admin password}"
      CLICKHOUSE_GRAFANA_PASSWORD: "${SERVICE_PASSWORD_CLICKHOUSEGRAFANA:?Coolify generates this Grafana datasource password}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    expose:
      - "8123"
      - "9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - type: bind
        source: /root/MyCallConnect
        target: /cdr-source/cdr/MyCallConnect
        read_only: true
      - type: bind
        source: /root/SalamTalk
        target: /cdr-source/cdr/SalamTalk
        read_only: true
      - type: bind
        source: /root/Dialphone
        target: /cdr-source/cdr/Dialphone
        read_only: true
      - type: bind
        source: /root/Vestacall
        target: /cdr-source/cdr/Vestacall
        read_only: true
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    stop_grace_period: 60s

  cdr-direct:
    build:
      context: .
      args:
        DUCKDB_VERSION: "1.5.4"
    init: true
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      CDR_AUTH_TOKEN: "${CDR_AUTH_TOKEN:?Set CDR_AUTH_TOKEN}"
      CDR_ROOT: /data/raw
      CDR_APP_DATA_ROOT: /data/runtime
      CDR_PARQUET_ROOT: /data/parquet
      CDR_DB_PATH: /data/runtime/cdrdata.duckdb
      CDR_CACHE_DB: /data/runtime/cache.sqlite
      CDR_DUCKDB_BIN: /usr/local/bin/duckdb
      CDR_ENABLE_SQL: "0"
      CDR_DUCKDB_THREADS: "${CDR_DUCKDB_THREADS:-8}"
      CDR_DUCKDB_MEMORY_LIMIT: "${CDR_DUCKDB_MEMORY_LIMIT:-8GB}"
      CDR_WEB_WORKERS: "1"
      CDR_WEB_THREADS: "4"
      CDR_WEB_TIMEOUT: "${CDR_WEB_TIMEOUT:-1800}"
    volumes:
      - type: bind
        source: /root/MyCallConnect
        target: /data/raw/MyCallConnect
        read_only: true
      - type: bind
        source: /root/SalamTalk
        target: /data/raw/SalamTalk
        read_only: true
      - type: bind
        source: /root/Dialphone
        target: /data/raw/Dialphone
        read_only: true
      - type: bind
        source: /root/Vestacall
        target: /data/raw/Vestacall
        read_only: true
      - cdr-runtime:/data/runtime
      - cdr-parquet:/data/parquet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: 30s

  cdr-clickhouse-ingester:
    build:
      context: .
      args:
        DUCKDB_VERSION: "1.5.4"
    init: true
    restart: unless-stopped
    command: ["python", "clickhouse_ingester.py", "--loop"]
    environment:
      CDR_ROOT: /data/raw
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: cdr
      CLICKHOUSE_USER: cdr_admin
      CLICKHOUSE_PASSWORD: "${SERVICE_PASSWORD_CLICKHOUSEADMIN:?Coolify generates this ClickHouse admin password}"
      CDR_INGEST_LOOKBACK_DAYS: "${CDR_INGEST_LOOKBACK_DAYS:-2}"
      CDR_INGEST_MIN_AGE_SECONDS: "${CDR_INGEST_MIN_AGE_SECONDS:-600}"
      CDR_INGEST_INTERVAL_SECONDS: "${CDR_INGEST_INTERVAL_SECONDS:-60}"
      CDR_INGEST_QUERY_TIMEOUT: "${CDR_INGEST_QUERY_TIMEOUT:-1800}"
    volumes:
      - type: bind
        source: /root/MyCallConnect
        target: /data/raw/MyCallConnect
        read_only: true
      - type: bind
        source: /root/SalamTalk
        target: /data/raw/SalamTalk
        read_only: true
      - type: bind
        source: /root/Dialphone
        target: /data/raw/Dialphone
        read_only: true
      - type: bind
        source: /root/Vestacall
        target: /data/raw/Vestacall
        read_only: true
    depends_on:
      clickhouse:
        condition: service_healthy

  cdr-cache-warmer:
    build:
      context: .
      args:
        DUCKDB_VERSION: "1.5.4"
    init: true
    restart: unless-stopped
    command: ["python", "cache_warmer.py", "--loop"]
    environment:
      CDR_AUTH_TOKEN: "${CDR_AUTH_TOKEN:?Set CDR_AUTH_TOKEN}"
      CDR_API_URL: http://cdr-direct:8090
      CDR_CACHE_WARM_INTERVAL: "${CDR_CACHE_WARM_INTERVAL:-900}"
      CDR_CACHE_WARM_TIMEOUT: "${CDR_CACHE_WARM_TIMEOUT:-1800}"
      CDR_CACHE_FINAL_REFRESH_UTC_HOUR: "${CDR_CACHE_FINAL_REFRESH_UTC_HOUR:-2}"
    depends_on:
      cdr-direct:
        condition: service_healthy

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    init: true
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${SERVICE_PASSWORD_GRAFANAADMIN:?Coolify generates this Grafana admin password}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ""
      CLICKHOUSE_GRAFANA_PASSWORD: "${SERVICE_PASSWORD_CLICKHOUSEGRAFANA:?Coolify generates this Grafana datasource password}"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    stop_grace_period: 30s

volumes:
  cdr-runtime:
  cdr-parquet:
  clickhouse-data:
  clickhouse-logs:
  grafana-data:
